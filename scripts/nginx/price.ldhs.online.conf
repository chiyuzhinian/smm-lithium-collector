# SMM 锂电数据中心 — 业务域名入口 price.ldhs.online（HTTPS）
# 证书：certbot --nginx -d price.ldhs.online --redirect（Let's Encrypt，certbot.timer 自动续期）
# 部署（root）：
#   cp scripts/nginx/price.ldhs.online.conf /etc/nginx/sites-available/price.ldhs.online
#   ln -sf /etc/nginx/sites-available/price.ldhs.online /etc/nginx/sites-enabled/price.ldhs.online
#   nginx -t && systemctl reload nginx
# ⚠️ 启用前提：域名 A 记录已指向本服务器公网 IP，且 ICP 备案状态有效。
#   仅域名入口 http→https 301；公网 IP 入口（ip-access default_server）不跳转、不受影响。

server {
    listen 80;
    listen [::]:80;
    server_name price.ldhs.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name price.ldhs.online;

    ssl_certificate /etc/letsencrypt/live/price.ldhs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/price.ldhs.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
