# SMM 锂电数据中心 — 业务域名入口 price.ldhs.online（HTTPS）
# 证书：阿里云免费证书（Nginx 格式，每年手动续期；境外 Let's Encrypt 不可达，
#   实测 acme-v02.api.letsencrypt.org TCP 不通，故不用 certbot——见
#   docs/change-records/2026-10-22/price-domain-dingtalk-report/03-domain-change.md）。
# 证书文件路径（root）：
#   /etc/nginx/ssl/price.ldhs.online/fullchain.pem   # 证书链（阿里云下载的 .pem）
#   /etc/nginx/ssl/price.ldhs.online/privkey.pem     # 私钥（chmod 600）
# 部署（root）：
#   cp scripts/nginx/price.ldhs.online.conf /etc/nginx/sites-available/price.ldhs.online
#   ln -sf /etc/nginx/sites-available/price.ldhs.online /etc/nginx/sites-enabled/price.ldhs.online
#   nginx -t && systemctl reload nginx
# ⚠️ 启用前提：域名 A 记录已指向本服务器公网 IP，且 ICP 备案状态有效。
#   仅域名入口 http→https 301；公网 IP 入口（ip-access default_server）不跳转、不受影响。

server {
    listen 80;
    listen [::]:80;
    server_name price.ldhs.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name price.ldhs.online;

    ssl_certificate /etc/nginx/ssl/price.ldhs.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/price.ldhs.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
