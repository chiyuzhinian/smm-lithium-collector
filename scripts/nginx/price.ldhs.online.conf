# SMM 锂电数据中心 — 业务域名入口 price.ldhs.online
# 部署（root）：
#   cp scripts/nginx/price.ldhs.online.conf /etc/nginx/sites-available/price.ldhs.online
#   ln -sf /etc/nginx/sites-available/price.ldhs.online /etc/nginx/sites-enabled/price.ldhs.online
#   nginx -t && systemctl reload nginx
# ⚠️ 启用前提：域名 A 记录已指向本服务器公网 IP，且 ICP 备案状态有效
#   （备案状态见 DEPLOYMENT_STATUS_2026-08-19.md）。DNS 切换前勿启用。

server {
    listen 80;
    listen [::]:80;
    server_name price.ldhs.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
