# SMM 锂电数据中心 — 公网 IP 直连入口（临时/备用入口）
# 用途：域名未切换/备案未完成时的公网访问入口（default_server）。
# 部署（root）：
#   cp scripts/nginx/ip-access.conf /etc/nginx/sites-available/ip-access
#   把 {PUBLIC_IP} 替换为新服务器公网 IP
#   ln -sf /etc/nginx/sites-available/ip-access /etc/nginx/sites-enabled/ip-access
#   nginx -t && systemctl reload nginx
# 说明：8888 门户内部服务仅监听 127.0.0.1，公网一律经本配置代理。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name {PUBLIC_IP};

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
