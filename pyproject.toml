[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smm-lithium-collector"
version = "1.0.0"
description = "Compliant SMM lithium spot price collector"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45,<2", "pandas>=2.2,<3", "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2", "PyYAML>=6.0,<7", "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5", "lxml>=5.2,<6"
]

[project.scripts]
smm-collect = "smm_collector.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
