<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 锂电价格与回收业务数据中心</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="login" class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">⚡</div>
    <h1>锂电价格与回收业务数据中心</h1>
    <p class="login-sub">华友内部数据服务</p>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <div class="login-error" id="login-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
    </form>
    <p class="login-foot">没有账号？<a href="/register">注册账号</a></p>
  </div>
  <p class="login-foot">数据来源：SMM 上海有色网公开报价（采集器自动采集） · 仅供内部使用</p>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
