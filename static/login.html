<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 华友锂电行情数据中心</title>
<link rel="stylesheet" href="/static/css/app.css?v=4">
</head>
<body data-page="login">
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">锂</span>
    </div>
    <h1 class="auth-title">华友锂电行情数据中心</h1>
    <p class="auth-sub">登录后可查看每日报价、价格走势与月度业务报表</p>
    <form id="login-form">
      <div class="auth-field">
        <label for="username">用户名</label>
        <input class="auth-input" id="username" name="username" type="text" required autofocus autocomplete="username">
      </div>
      <div class="auth-field">
        <label for="password">密码</label>
        <input class="auth-input" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <div class="auth-error" id="login-error" hidden></div>
      <button type="submit" class="auth-btn" id="login-btn">登 录</button>
    </form>
    <p class="auth-foot">没有账号？<a href="/register">注册账号</a></p>
    <p style="margin-top:18px;text-align:center;font-size:12px;color:var(--ink-4)">数据来源：SMM 上海有色网公开报价（采集器自动采集） · 仅供内部使用</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/api.js?v=4"></script>
<script src="/static/js/login.js?v=4"></script>
</body>
</html>
