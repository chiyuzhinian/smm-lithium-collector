<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 华友锂电行情数据中心</title>
<link rel="stylesheet" href="/static/css/app.css?v=4">
</head>
<body data-page="register">
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">锂</span>
    </div>
    <h1 class="auth-title">注册账号</h1>
    <p class="auth-sub">注册后为普通用户，仅可查看数据栏目；管理员权限由管理员分配</p>
    <form id="register-form">
      <div class="auth-field">
        <label for="username">用户名</label>
        <input class="auth-input" id="username" name="username" type="text" required autofocus autocomplete="username"
               minlength="3" maxlength="30" pattern="[A-Za-z0-9_\-一-龥]{3,30}"
               title="3-30 位字母、数字、下划线、连字符或中文">
      </div>
      <div class="auth-field">
        <label for="password">密码（至少 8 位）</label>
        <input class="auth-input" id="password" name="password" type="password" required autocomplete="new-password"
               minlength="8" maxlength="128" title="至少 8 位，最多 128 位">
      </div>
      <div class="auth-error" id="register-error" hidden></div>
      <button type="submit" class="auth-btn" id="register-btn">注 册</button>
    </form>
    <p class="auth-foot">已有账号？<a href="/login">返回登录</a></p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/api.js?v=4"></script>
<script src="/static/js/register.js?v=4"></script>
</body>
</html>
