<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 - 无权限访问</title>
<style>
  /* 自包含样式：本页由服务端在无权限时直接返回，不依赖外部资源 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f8fafc; color: #1e293b; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; line-height: 1.6;
  }
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 3rem 4rem; text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.04);
  }
  h1 { font-size: 2.4rem; color: #1e40af; }
  p { color: #64748b; margin: .6rem 0 1.4rem; }
  a {
    display: inline-block; background: #1e40af; color: #fff; text-decoration: none;
    padding: .55rem 1.4rem; border-radius: 8px; font-size: .9rem;
  }
  a:hover { background: #3b82f6; }
</style>
</head>
<body>
<div class="card">
  <h1>403</h1>
  <p>无权限访问（无管理员权限或访问被拒绝）</p>
  <a href="/">返回首页</a>
</div>
</body>
</html>
