<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 · 无权限访问</title>
<style>
  /* 自包含样式：本页由服务端在无权限时直接返回，不依赖外部资源（深色 V3 一致） */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0D1422; color: #E6EDF7; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; line-height: 1.6;
  }
  .card {
    background: #151F30; border: 1px solid #2A3A50; border-radius: 8px;
    padding: 3rem 4rem; text-align: center;
    box-shadow: 0 8px 24px rgba(4,8,16,.55);
  }
  .code { font-size: 2.6rem; font-weight: 700; color: #7DA7FF; font-family: ui-monospace, Consolas, monospace; }
  p { color: #A5B3C7; margin: .6rem 0 1.4rem; }
  a {
    display: inline-block; background: #7DA7FF; color: #0B1220; text-decoration: none;
    padding: .55rem 1.4rem; border-radius: 6px; font-size: .9rem; font-weight: 600;
  }
  a:hover { background: #8FB4FF; }
</style>
</head>
<body>
<div class="card">
  <div class="code">403</div>
  <p>无权限访问（无管理员权限或访问被拒绝）</p>
  <a href="/">返回首页</a>
</div>
</body>
</html>
