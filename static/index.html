<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日报价 · 锂电价格与回收业务数据中心</title>
<link rel="stylesheet" href="/static/css/app.css?v=5">
</head>
<body data-page="quotes">
<div id="navbar"></div>

<div class="main-container">

  <!-- 页头：标题 + 紧凑状态行 + 操作，同一水平区域 -->
  <div class="page-head">
    <div class="page-head-left">
      <h1 class="page-title">每日报价</h1>
      <div class="page-status">
        <span><span class="status-dot"></span>最新报价日期 <b class="num" id="st-latest">—</b></span>
        <span class="status-sep">·</span>
        <span>采集更新 <b class="num" id="st-collected">—</b></span>
        <span class="status-sep">·</span>
        <span>品种数 <b class="num" id="st-count">—</b></span>
        <span class="status-sep">·</span>
        <span>查询范围 <b class="num" id="st-range">—</b> 起</span>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn sm" href="/trends" id="btn-trends">价格走势 →</a>
    </div>
  </div>

  <!-- 筛选栏（标签与控件同行）：类别 → 产品多选 → 搜索 → 报价日期 -->
  <div class="filter-bar">
    <div class="field">
      <label for="cat-select">业务类别</label>
      <select class="ctl" id="cat-select"><option value="">全部类别</option></select>
    </div>
    <div class="field search-field">
      <label for="prod-pick">产品</label>
      <div class="search-wrap">
        <button class="ctl pick-input" id="prod-pick" type="button"
                aria-haspopup="listbox" title="点击选择产品（可多选、可跨类别累积）">选择产品 ▾</button>
        <div class="search-suggest" id="prod-suggest"></div>
      </div>
    </div>
    <div class="field search-field">
      <label for="q-input">产品搜索</label>
      <div class="search-wrap">
        <input class="ctl search-input" id="q-input" type="text" autocomplete="off"
               placeholder="业务名称 / SMM 名称 / 缩写，如：碳酸锂、LFP、523">
        <span class="search-icon">⌕</span>
        <div class="search-suggest" id="q-suggest"></div>
      </div>
    </div>
    <div class="field">
      <label for="asof-input">报价日期</label>
      <input class="ctl" type="date" id="asof-input" title="含当日及更早的最新报价">
    </div>
    <button class="btn" id="reset-btn">重置</button>
    <div class="chips-row" id="picked-chips"></div>
    <div class="result-count" id="result-count">—</div>
  </div>

  <!-- 数据口径（可展开） -->
  <details class="caliber-box">
    <summary>数据口径与说明</summary>
    <div class="caliber-body">
      <div><b>日均价</b> = 对应报价日期的 SMM average_price 源字段，不在前端重算；缺值显示「—」。</div>
      <div><b>周报价品种</b>显示实际报价日期与「周报价」标识，不伪装成每日发布。</div>
      <div><b>涨跌</b>展示源字段 change_value 并按原单位解释；涨红跌绿，保留正负号。</div>
      <div><b>报价日期</b>为业务报价日（as_of）：默认展示最新可用报价；选择日期后展示截至该日的报价（不含未来报价）。</div>
    </div>
  </details>

  <!-- 价格表（固定视口，内部滚动） -->
  <div class="panel panel-fill">
    <div class="table-scroll" id="table-scroll">
      <div class="loading" id="table-loading"><span class="spinner"></span>正在加载最新报价…</div>
    </div>
  </div>

</div>

<div id="footer"></div>
<div class="toast" id="toast"></div>

<script src="/static/js/echarts.min.js?v=5"></script>
<script src="/static/js/api.js?v=5"></script>
<script src="/static/js/common.js?v=5"></script>
<script src="/static/js/nav.js?v=5"></script>
<script src="/static/js/quotes.js?v=5"></script>
</body>
</html>
