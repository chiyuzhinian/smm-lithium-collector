<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锂电价格与回收业务数据中心</title>
<link rel="stylesheet" href="/static/css/style.css?v=20260819">
</head>
<body data-page="home">
<div id="navbar"></div>

<div class="main-container">

  <!-- Banner -->
  <section class="banner">
    <h1>锂电价格与回收业务数据中心</h1>
    <p class="banner-desc">聚焦锂电价格、材料价格、基础金属与回收链价格数据，支持每日下载、历史归档与业务分析。</p>
    <div class="banner-chart">
      <svg viewBox="0 0 200 60">
        <polyline fill="none" stroke="white" stroke-width="1.5"
          points="0,45 20,35 40,38 60,20 80,25 100,10 120,15 140,5 160,12 180,3 200,8"/>
        <polyline fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"
          points="0,50 20,42 40,48 60,30 80,35 100,20 120,28 140,15 160,22 180,12 200,18"/>
      </svg>
    </div>
  </section>

  <!-- 今日必看（第一优先级） -->
  <section class="section" id="today">
    <div class="section-title">🔴 今日必看</div>
    <div class="today-card" id="today-card">
      <div class="empty-state"><div class="empty-icon">⏳</div><div>加载中…</div></div>
    </div>
  </section>

  <!-- 重点产品价格（首页核心模块：全部数据来自数据库真实记录） -->
  <section class="section">
    <div class="section-title">重点产品价格 <span class="section-note">最新价 · 较上次变化 · 近7日真实趋势 · 数据日期/更新时间</span></div>
    <div class="kp-toolbar">
      <div class="kp-tabs" id="kp-tabs">
        <button class="kp-tab active" data-tab="all">全部</button>
        <button class="kp-tab" data-tab="回收">回收</button>
        <button class="kp-tab" data-tab="正极材料">正极材料</button>
      </div>
      <input id="kp-search" type="search" placeholder="搜索产品名称 / 规格…">
    </div>
    <div class="kp-body" id="kp-body">
      <div class="empty-state"><div class="empty-icon">⏳</div><div>加载中…</div></div>
    </div>
  </section>

  <!-- 业务专题入口 -->
  <section class="section">
    <div class="section-title">业务专题</div>
    <div class="topic-grid" id="topic-grid"></div>
  </section>

  <!-- 最近 7 天价格数据 + 固定汇总状态 -->
  <div class="two-col">
    <section class="section">
      <div class="section-title">最近 7 天价格数据 <span class="section-note">按数据业务日期</span></div>
      <div class="recent-list" id="recent-list"></div>
    </section>
    <section class="section">
      <div class="section-title">固定汇总状态</div>
      <div id="fixed-summary"></div>
    </section>
  </div>

</div>

<div id="footer"></div>
<div class="toast" id="toast"></div>

<!-- 产品趋势弹窗（近7天/近30天真实价格，按需加载） -->
<div class="modal-overlay" id="kp-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="产品趋势">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="kp-modal-title"></div>
        <div class="modal-sub" id="kp-modal-sub"></div>
      </div>
      <button class="modal-close" id="kp-modal-close" aria-label="关闭">×</button>
    </div>
    <div class="range-toggle">
      <button class="range-btn active" data-range="7d">近7天</button>
      <button class="range-btn" data-range="30d">近30天</button>
    </div>
    <div class="chart-box" id="kp-chart" data-chart></div>
    <div class="modal-foot" id="kp-modal-foot"></div>
  </div>
</div>

<script src="/static/js/echarts.min.js?v=20260819"></script>
<script src="/static/js/api.js?v=20260819"></script>
<script src="/static/js/charts.js?v=20260819"></script>
<script src="/static/js/nav.js?v=20260819"></script>
<script src="/static/js/home.js?v=20260819"></script>
<script src="/static/js/keyproducts.js?v=20260819"></script>
</body>
</html>
