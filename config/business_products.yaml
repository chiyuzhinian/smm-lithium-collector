# ============================================================
# 业务品种 → 数据库报价系列 映射（门户统一业务映射）
# ============================================================
# 消费方：每日报价首页 / 价格走势 / 月度业务报表（共用同一映射与同一数据服务层）
#
# 依据（2026-09-06）：
#   1) 《市场价格数据模板》最新页「8月28日」49 条业务记录（40 条 SMM）
#   2) 逐行映射证据：smm_template_mapping.json（34 条明确对应 + 6 条规格待核）
#   3) SMM 官方公告（磷酸铁锂正极材料价格点调整）：
#       征询函 2026-03-16 https://news.smm.cn/gonggao/103808001
#       正式公告 2026-07-17 生效 https://news.smm.cn/news/104009835
#      证据摘要：docs/smm_lfp_price_point_change_2026.md
#
# 绑定规则：
#   - 身份 = (category, product_name, specification) 精确三元组，绝不用模糊名称匹配
#   - record_hash 是记录哈希，不是跨日期产品 ID，不得用于业务去重
#   - 同 (product_name, specification, unit, price_date) 跨分类重复收录只计一次
#   - 现货价与指数/加工费/系数严格隔离：series 只绑现货三元组
#   - series 为列表以支持规格改名合并（按 price_date 升序合并；有效日期仅文档化）
#
# 口径说明（必须在门户与月报中展示）：
#   - 日均价 = 某报价日期 average_price 源字段，绝不前端重算
#   - 月均价 = 所选自然月内有效报价 average_price 的算术平均（按有效发布日计）
#   - 环比 =（本月月均价-上月月均价）/上月月均价×100%，仅相邻两月均完整时计算
#   - 周报价品种：月均价按当月实际发布的报价点计，同报价点重复采集不增权重
# ============================================================

version: 1
meta:
  name: "业务品种映射（月度业务报表 49 行版式）"
  template_sheet: "8月28日"
  history_from: "2026-07-20"      # 采集起点；门户日期选择下限
  daily_completeness_ratio: 0.8   # 日频品种：当月报价日数/当月预期交易日数 ≥ 该值判完整
  weekly_completeness_ratio: 0.75 # 周频品种：当月报价点数/当月周数 ≥ 该值判完整
  monthly_method_note: "月均价=当月有效报价 average_price 算术平均（按报价点计，重复采集去重）；仅相邻两月均完整时计算环比"

