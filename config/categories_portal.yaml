# ============================================================
# SMM 锂电价格与回收业务数据中心 — 门户与固定汇总门控统一配置
# ============================================================
# 本文件同时驱动：
#   1) 前端门户（业务分组 A-F、首页指标卡、业务专题、文案）
#   2) 采集侧固定汇总门控（规范分类全集 + 阈值）
# 维护方法：
#   - 页面出现新分类 → 加入 canonical_categories 并归入某 group
#   - 未归组分类会出现在每日 manifest 的 missing_categories 中提醒维护
# ============================================================

portal:
  title: "SMM 锂电价格与回收业务数据中心"
  subtitle: "聚焦锂电价格、材料价格、基础金属与回收链价格数据，支持每日下载、历史归档与业务分析。"
  company: "华友"

# ── 规范分类全集（SMM 页面 40 个发现分类；固定汇总门控的判定基准） ──
# 注意：「基础金属」是附加数据源（铝/铜/镍），进数据但不计入采集成功数
canonical_categories:
  - 锂化合物
  - 锂矿
  - 锂金属
  - 钴金属
  - 钴矿
  - 钴化合物
  - 镍化合物
  - 锰化合物
  - 正极材料
  - 人造石墨
  - 天然石墨负极
  - 新型负极
  - 天然石墨
  - 焦类
  - 电解液
  - 溶剂及相关原料
  - 添加剂
  - 隔膜
  - 电芯
  - 储能电芯
  - 电池舱
  - PACK
  - 磷矿
  - 磷化工
  - 铁源
  - 铝箔
  - 铜箔
  - PVDF
  - 其他辅料
  - 废旧锂电池
  - 未注液电芯价格
  - 未注液卷芯价格
  - 废旧正极片及系数
  - 废旧锂电黑粉系数指数
  - 废旧锂电黑粉系数
  - 废旧锂电黑粉价格
  - 梯次回收价格
  - SMM-五矿锂汇通废旧锂电池
  - 碳素
  - 电炉钢

# ── 附加源分类（进文件与汇总数据，但不计入采集成功数） ──
additional_categories:
  - category: "基础金属"
    source: "SMM基础金属现货"

# ── A-F 业务分组（41 个实际分类全覆盖） ──
groups:
  A:
    name: "锂资源与锂盐"
    description: "锂矿、锂盐及锂金属原料价格"
    icon: "🔋"
    categories: [锂矿, 锂化合物, 锂金属]
  B:
    name: "正负极材料"
    description: "正极材料与石墨负极体系价格"
    icon: "🧱"
    categories: [正极材料, 人造石墨, 天然石墨, 天然石墨负极, 新型负极]
  C:
    name: "电芯与材料"
    description: "电芯、电池组件及辅材（含未注液品）"
    icon: "🔌"
    categories: [电芯, 储能电芯, 电解液, 隔膜, PACK, PVDF, 添加剂,
                 溶剂及相关原料, 未注液电芯价格, 未注液卷芯价格, 其他辅料]
  D:
    name: "基础金属"
    description: "铜铝镍钴锰铁等金属与化合物价格"
    icon: "⚙️"
    categories: [基础金属, 铜箔, 铝箔, 钴金属, 钴矿, 钴化合物,
                 镍化合物, 锰化合物, 铁源]
  E:
    name: "回收链"
    description: "废旧电池、梯次利用、黑粉与废极片（华友重点）"
    icon: "♻️"
    categories: [废旧锂电池, 废旧锂电黑粉价格, 废旧锂电黑粉系数,
                 废旧锂电黑粉系数指数, 废旧正极片及系数, 梯次回收价格,
                 SMM-五矿锂汇通废旧锂电池]
  F:
    name: "其他"
    description: "焦类、磷系及行业参考分类"
    icon: "📦"
    categories: [焦类, 磷矿, 磷化工, 电池舱, 碳素, 电炉钢]

# ── 固定汇总门控阈值 ──
# 日期对齐率 = 行中 price_date==target_date 的占比。
# 注意：页面含周更品种（电芯周/铜箔加工费周等），其行日期天然滞后，
# 健康同日采集的对齐率实测约 0.74（325/438），次日早采≈0 → 阈值取 0.6 留余量。
summary_gate:
  min_date_alignment_ratio: 0.6    # price_date==target 行占比下限
  max_invalid_ratio: 0.05          # invalid 行占比上限

# ── 首页关键指标卡（12 张；product 为 lithium_spot_prices.product_name 精确值） ──
metrics:
