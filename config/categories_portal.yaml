# ============================================================
# 锂电价格与回收业务数据中心 — 门户与固定汇总门控统一配置
# ============================================================
# 本文件同时驱动：
#   1) 前端门户（业务分组 A-F、首页指标卡、业务专题、文案）
#   2) 采集侧固定汇总门控（规范分类全集 + 阈值）
# 维护方法：
#   - 页面出现新分类 → 加入 canonical_categories 并归入某 group
#   - 未归组分类会出现在每日 manifest 的 missing_categories 中提醒维护
# ============================================================

portal:
  title: "锂电价格与回收业务数据中心"
  subtitle: "聚焦锂电价格、材料价格、基础金属与回收链价格数据，支持每日下载、历史归档与业务分析。"

# ── 规范分类全集（SMM 页面 40 个发现分类；固定汇总门控的判定基准） ──
# 注意：「基础金属」是附加数据源（铝/铜/镍），进数据但不计入采集成功数
canonical_categories:
  - 锂化合物
  - 锂矿
  - 锂金属
  - 钴金属
  - 钴矿
  - 钴化合物
  - 镍化合物
  - 锰化合物
  - 正极材料
  - 人造石墨
  - 天然石墨负极
  - 新型负极
  - 天然石墨
  - 焦类
  - 电解液
  - 溶剂及相关原料
  - 添加剂
  - 隔膜
  - 电芯
  - 储能电芯
  - 电池舱
  - PACK
  - 磷矿
  - 磷化工
  - 铁源
  - 铝箔
  - 铜箔
  - PVDF
  - 其他辅料
  - 废旧锂电池
  - 未注液电芯价格
  - 未注液卷芯价格
  - 废旧正极片及系数
  - 废旧锂电黑粉系数指数
  - 废旧锂电黑粉系数
  - 废旧锂电黑粉价格
  - 梯次回收价格
  - SMM-五矿锂汇通废旧锂电池
  - 碳素
  - 电炉钢

# ── 附加源分类（进文件与汇总数据，但不计入采集成功数） ──
additional_categories:
  - category: "基础金属"
    source: "SMM基础金属现货"

# ── A-F 业务分组（41 个实际分类全覆盖） ──
groups:
  A:
    name: "锂资源与锂盐"
    description: "锂矿、锂盐及锂金属原料价格"
    icon: "🔋"
    categories: [锂矿, 锂化合物, 锂金属]
  B:
    name: "正负极材料"
    description: "正极材料与石墨负极体系价格"
    icon: "🧱"
    categories: [正极材料, 人造石墨, 天然石墨, 天然石墨负极, 新型负极]
  C:
    name: "电芯与材料"
    description: "电芯、电池组件及辅材（含未注液品）"
    icon: "🔌"
    categories: [电芯, 储能电芯, 电解液, 隔膜, PACK, PVDF, 添加剂,
                 溶剂及相关原料, 未注液电芯价格, 未注液卷芯价格, 其他辅料]
  D:
    name: "基础金属"
    description: "铜铝镍钴锰铁等金属与化合物价格"
    icon: "⚙️"
    categories: [基础金属, 铜箔, 铝箔, 钴金属, 钴矿, 钴化合物,
                 镍化合物, 锰化合物, 铁源]
  E:
    name: "回收链"
    description: "废旧电池、梯次利用、黑粉与废极片（回收重点）"
    icon: "♻️"
    categories: [废旧锂电池, 废旧锂电黑粉价格, 废旧锂电黑粉系数,
                 废旧锂电黑粉系数指数, 废旧正极片及系数, 梯次回收价格,
                 SMM-五矿锂汇通废旧锂电池]
  F:
    name: "其他"
    description: "焦类、磷系及行业参考分类"
    icon: "📦"
    categories: [焦类, 磷矿, 磷化工, 电池舱, 碳素, 电炉钢]

# ── 固定汇总门控阈值 ──
# 日期对齐率 = 行中 price_date==数据日期（页面数据日期校准后的众数）的占比。
# 页面含周更品种（电芯周/铜箔加工费周等），其行日期天然滞后：
# 健康同日采集的对齐率实测约 0.74（325/438），次日早采（页面为前一交易日数据）≈0.93
# → 阈值取 0.6 留余量。SMM 当日未发布时按页面日期校准，不产生 temp_snapshot。
summary_gate:
  min_date_alignment_ratio: 0.6    # price_date==data_date 行占比下限
  max_invalid_ratio: 0.05          # invalid 行占比上限

# ── 首页关键指标卡（12 张；product 为 lithium_spot_prices.product_name 精确值，留空=整分类均价） ──
# 注意：隔膜品类 2026-07 起页面产品名改为 湿法基膜/干法基膜/涂覆基膜 等（原「隔膜」汇总行下线），
# 故 product 留空按整分类取价，避免卡片停留在旧序列。
metrics:
  - {key: lce_battery,          name: "电池级碳酸锂",   category: 锂化合物,       product: "电池级碳酸锂",           group: A}
  - {key: lh_battery,           name: "电池级氢氧化锂", category: 锂化合物,       product: "电池级氢氧化锂（粗颗粒）", group: A}
  - {key: lfp_cathode,          name: "磷酸铁锂",       category: 正极材料,       product: "磷酸铁锂",               group: B}
  - {key: ncm523,               name: "三元材料5系",    category: 正极材料,       product: "5系三元材料",            group: B}
  - {key: lfp_cell,             name: "方形LFP电芯",    category: 电芯,           product: "方形磷酸铁锂电芯(周)",    group: C}
  - {key: electrolyte,          name: "电解液",         category: 电解液,         product: "电解液",                 group: C}
  - {key: separator,            name: "隔膜",           category: 隔膜,           product: "",                      group: C}
  - {key: copper,               name: "1#电解铜",       category: 基础金属,       product: "1#电解铜",               group: D}
  - {key: aluminum,             name: "A00铝",          category: 基础金属,       product: "A00铝",                  group: D}
  - {key: nickel,               name: "1#电解镍",       category: 基础金属,       product: "1#电解镍",               group: D}
  - {key: waste_lfp_pack,       name: "废旧LFP电池包",  category: 废旧锂电池,     product: "废旧磷酸铁锂铝壳电池包",  group: E}
  - {key: lfp_powder,           name: "LFP极片粉",      category: 废旧锂电黑粉价格, product: "磷酸铁锂极片粉",         group: E}

# ── 首页「重点产品价格」模块（20 个展示产品 = 24 个 DB 三元组） ──
# 身份 = (category, product_name, specification) 精确匹配，绝不用模糊名称匹配。
# 同产品在「磷化工」分类下的重复行（同一 SMM 页双分类收录）靠 db[].category 钉死规避，杜绝双卡。
# db 为列表以支持规格改名合并：2026-08-03 SMM 页规格文本变更（压实密度→粉体压实密度），
# 价格序列连续（07-31 压实密度≥2.55g/cm³ → 08-03 粉体压实密度≥2.55g/cm³），
# 两三元合并为一条按 price_date 升序的序列。若 SMM 再次改名，往对应 entry 的 db 列表追加新三元组即可。
# 金属盐按业务确认取同名现货产品（非 SMM 指数）；数据口径：value=最新有效价，
# change_pct=(最新-上一真实有效记录)/上一×100（较上次），7d/30d 窗口只含 DB 真实日期，缺口不补。
