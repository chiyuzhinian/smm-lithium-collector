# ── 门户账号与会话（2026-08-13 起：表单登录 + 服务端 Session，替代 HTTP Basic） ──
# 账号（huayou/admin）与密码哈希保存在 /var/lib/smm-fileserver/auth.db（0600，Web 不可达），
# 本文件不存任何凭据。初始化/重置：python scripts/init_auth.py
auth:
  session_ttl_hours: 10          # 普通用户会话有效期
  admin_session_ttl_hours: 4     # 管理员会话有效期
  cookie_secure: false           # 部署 HTTPS 终止层（Nginx 等）后改为 true
  lockout_max_failures: 5        # 同一账号+IP 连续失败 N 次后锁定
  lockout_window_minutes: 10     # 失败计数滚动窗口（分钟）
  lockout_minutes: 10            # 锁定时长（分钟）
  password_min_length: 8         # 新密码最短长度

# ── 运维健康检查阈值（管理员运维中心使用；统一在此配置，不散落前端） ──
health:
  cache_seconds: 30              # overview 聚合缓存（也是前端建议轮询间隔）
  disk_warn_pct: 80              # 磁盘占用 ≥80% → 警告
  disk_crit_pct: 90              # ≥90% → 异常
  mem_warn_pct: 80
  mem_crit_pct: 90
  load_warn: 3.0                 # 1 分钟 load average（2 核机器）
  load_crit: 4.0
  collector_timeout_minutes: 45  # 采集运行超过该时长 → 警告（只提示不杀进程）
  freshness_check_hour: 14       # 工作日超过该时点仍未产出当日数据 → 「数据可能未及时更新」警告

# ── 管理员日志查看白名单（{date} 只由服务器时钟推导，绝不接受客户端路径） ──
admin:
  log_names:
    app:        "logs/collector_{date}.log"
    error:      "logs/error_{date}.log"
    cron:       "logs/cron.log"
    metals:     "logs/cron_metals.log"
    validation: "logs/validation/validation.log"
  max_log_lines: 200             # 单次最多返回行数
  log_days_back: 7               # 最多回看天数

# ── 定时任务表（与 scripts/install_cron.sh 保持同步；运维中心「采集任务」页展示） ──
tasks:
  - {key: daily,         name: "每日采集(早采)",       cron: "0 10 * * 1-5",  source: manifest_run}
  - {key: metals,        name: "铜铝镍补采",           cron: "0 11 * * 1-5",  source: metals_log}
  - {key: noon,          name: "全量兜底(含验证/汇总)", cron: "30 12 * * 1-5", source: manifest_run}
  - {key: validation,    name: "数据验证",             cron: "",               source: validation_log}
  - {key: fixed_summary, name: "固定汇总更新",         cron: "",               source: fixed_summary}
  - {key: mysql_sync,    name: "MySQL 同步",           cron: "",               source: quality_sync}
