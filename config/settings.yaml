site:
  source: "SMM"
  market: "SMM锂电现货"
categories:
  mode: "auto"          # "auto" = 自动发现全部；"manual" = 使用下方 items 列表
  items:                # mode: "manual" 时的固定分类列表（保留用于测试/特定场景）
    - {name: "锂金属", code: "lithium_metal"}
    - {name: "锂矿", code: "lithium_ore"}
    - {name: "锂化合物", code: "lithium_compound"}
output:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  export_dir: "data/exports"
  fixed_export_dir: "data/exports/固定汇总"
  screenshot_dir: "data/screenshots"
  database_path: "data/database/smm_lithium.db"
browser: {headless: true, timeout_ms: 30000, slow_mo_ms: 0}

# ── 每日统一数据验证（后台，结果写 logs/validation/，不对外展示） ──
# 9 层检查：文件/结构/日期/重复/缺失分类/数值/波动/历史连续性/固定汇总一致性
# 判定：FAIL（每日文件损坏/为空、核心字段缺失、日期完全错误、核心分类全部缺失、
#       当日全部行未通过数值校验）；WARNING（其余问题，仅记录不删除数据）
validation:
  enabled: true
  volatility_warning_pct: 20.0   # |日变化| > 20% → warning（仅提示，不拒绝数据）
  volatility_error_pct: 100.0    # > 100% → 仍只记 warning
  continuity_window_days: 10     # 历史连续性检查窗口（价格日数）
  max_report_items: 20           # 每个告警最多记录明细条数
  log_dir: "logs/validation"     # 验证日志目录（不在 Web 根，不对公网开放）
  category_overrides: {}         # 按分类覆盖波动阈值，如 {锂化合物: {warning_pct: 15.0}}
collector:
  max_retries: 3
  retry_base_seconds: 3
  save_html: true
  save_screenshot: true
  prefer_api: true
  continue_on_category_failure: true
  require_all_categories_for_success: true
  max_scroll_attempts: 30
additional_sources:
  enabled: true                # 是否采集附加数据源
  continue_on_source_failure: true  # 单个源失败不影响其他
  stale_after_days: 5          # 超过N天未更新的报价视为陈旧
  items:
    - code: "smm_aluminum"
      name: "SMM铝现货"
      source: "SMM"
      market: "SMM基础金属现货"
      url: "https://hq.smm.cn/aluminum/category/201102250311"
      category: "基础金属"
      selectors:
        table: ".ant-table table"
        row: ".ant-table tbody tr"
      required_products:
        - canonical_name: "A00铝"
          aliases: ["A00铝", "SMM A00铝"]
          material_attribute: "原料"
          info_category: "金属"
          chemistry: "铝"
          unit: "元/吨"

    - code: "smm_copper"
      name: "SMM铜现货"
      source: "SMM"
      market: "SMM基础金属现货"
      url: "https://hq.smm.cn/copper/category/201102250376"
      category: "基础金属"
      retry_after_minutes: 60     # 铜价发布较晚，60分钟后重试
      selectors:
        table: ".ant-table table"
        row: ".ant-table tbody tr"
      required_products:
        - canonical_name: "1#电解铜"
          aliases: ["1#电解铜", "SMM 1#电解铜", "1号电解铜"]
          material_attribute: "原料"
          info_category: "金属"
          chemistry: "铜"
          unit: "元/吨"

    - code: "smm_nickel"
      name: "SMM镍现货"
      source: "SMM"
      market: "SMM基础金属现货"
      url: "https://hq.smm.cn/nickel/category/201102250239"
      category: "基础金属"
      retry_after_minutes: 60     # 镍价发布较晚，60分钟后重试
      selectors:
        table: ".ant-table table"
        row: ".ant-table tbody tr"
      required_products:
        - canonical_name: "1#电解镍"
          aliases: ["1#电解镍", "SMM 1#电解镍", "1号电解镍"]
          material_attribute: "原料"
          info_category: "金属"
          chemistry: "镍"
          unit: "元/吨"
